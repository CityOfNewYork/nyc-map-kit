events {}
http {
    include mime.types;
    types {
        application/geo+json     geojson;
        application/octet-stream pmtiles;
        application/x-protobuf   pbf;
    }
    sendfile on;

    # Serve the .gz copies made in the Dockerfile, and compress anything else on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    server {
        listen 80;
        listen [::]:80;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
    }
}
