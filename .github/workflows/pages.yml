# Builds the app and publishes it to GitHub Pages. Every pull request is linted, tested,
# type-checked and built (`npm run build` runs tsc first); only main is ever published.
#
# The published site is dist/ — the build output, not the source — so the map is at
# <site>/app/. Repository settings → Pages → Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The Protomaps basemap is too large for git, so each deploy cuts it fresh from
      # Protomaps' daily build (build/protomaps.sh). Pull requests build without it.
      - name: Cut the Protomaps basemap
        if: github.ref == 'refs/heads/main'
        env:
          PMTILES_CLI: https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          PMTILES_CLI_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
        run: |
          curl -fsSL "$PMTILES_CLI" -o "$RUNNER_TEMP/pmtiles.tar.gz"
          echo "$PMTILES_CLI_SHA256  $RUNNER_TEMP/pmtiles.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pmtiles.tar.gz" -C "$RUNNER_TEMP" pmtiles
          build_name=$(PATH="$RUNNER_TEMP:$PATH" build/protomaps.sh)
          echo "Protomaps basemap cut from daily build $build_name" >> "$GITHUB_STEP_SUMMARY"
      # The Geoclient key for the search box. It ends up in the published bundle, readable
      # by anyone; the secret only keeps it out of git. Without it the search box still
      # finds neighborhoods, boroughs and ZIP codes.
      - run: npm run build
        env:
          VITE_GEOCLIENT_KEY: ${{ secrets.VITE_GEOCLIENT_KEY }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
