# Builds the app and publishes it to GitHub Pages. Every pull request is linted, tested,
# type-checked and built (`npm run build` runs tsc first); only main is ever published.
#
# The published site is dist/ — the build output, not the source — so the map is at
# <site>/app/. Repository settings → Pages → Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The Protomaps basemap is too large for git. Each deploy downloads one pinned file,
      # cut by build/protomaps.sh and kept at BASEMAP_URL; the checksum makes sure it is
      # that file. A newer basemap is cut on purpose and the two lines below updated (see
      # build/protomaps.sh). Pull requests build without it.
      - name: Download the Protomaps basemap
        if: github.ref == 'refs/heads/main'
        env:
          BASEMAP_URL: https://github.com/CityOfNewYork/nyc-map-kit/releases/download/basemap-20261019/nyc-20261019.pmtiles
          BASEMAP_SHA256: 11cdd7a0424208ae70e5e2975435a9c5d1e80e9ed445b1dca3d1c8c96c4d1e9b
        run: |
          curl -fsSL --retry 3 "$BASEMAP_URL" -o app/public/nyc.pmtiles
          echo "$BASEMAP_SHA256  app/public/nyc.pmtiles" | sha256sum -c -
          echo "Protomaps basemap: $BASEMAP_URL" >> "$GITHUB_STEP_SUMMARY"
      # Clash Grotesk may be self-hosted but not committed (build/clash-grotesk.sh). Pull
      # requests build without it, and the warming hero's heading falls back to Noto Sans.
      - name: Fetch Clash Grotesk
        if: github.ref == 'refs/heads/main'
        run: build/clash-grotesk.sh
      # The Geoclient key for the search box. It ends up in the published bundle, readable
      # by anyone; the secret only keeps it out of git. Without it the search box still
      # finds neighborhoods, boroughs and ZIP codes.
      - run: npm run build
        env:
          VITE_GEOCLIENT_KEY: ${{ secrets.VITE_GEOCLIENT_KEY }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
