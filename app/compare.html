<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basemap comparison</title>

<!--
  Two basemaps side by side, with nothing drawn on them, and the camera kept in step:
  pan or zoom either one and the other follows. It is for judging basemap changes, and
  is published alongside the map.

    compare.html                              Protomaps | OTI's, in our palette
    compare.html?right=nyc-original           Protomaps | OTI's, in its own colours
    compare.html?lang=es                      the basemaps' labels in that language

  The basemaps are listed in src/core/basemaps/names.ts. Each side is the block's own
  map (createMap) with no data, so it is the basemap exactly as the block shows it.
-->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: #fff;
    color: #1a1a1a;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  section + section { border-left: 1px solid #d9d9d9; }
  label { padding: 6px 12px; border-bottom: 1px solid #d9d9d9; }
  select { font: inherit; }
  .map { flex: 1; position: relative; }
  .mapcore-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    section + section { border-left: 0; border-top: 1px solid #d9d9d9; }
  }
</style>
</head>

<body>
<section><label>Left <select></select></label><div class="map" role="region" aria-label="Left map"></div></section>
<section><label>Right <select></select></label><div class="map" role="region" aria-label="Right map"></div></section>

<script type="module">
import { createMap } from "./src/core/map-core.ts";
import { loadBasemap } from "./src/core/basemaps/index.ts";
import { BASEMAP_NAMES, basemapId, DEFAULT_BASEMAP } from "./src/core/basemaps/names.ts";

const SIDES = ["left", "right"];
const DEFAULT = { left: DEFAULT_BASEMAP, right: "nyc" };

const page = new URLSearchParams(location.search);
// The block's basemap labels are English in every language unless asked otherwise.
const lang = page.get("lang") || "en";
const containers = [...document.querySelectorAll(".map")];
const selects = [...document.querySelectorAll("select")];
const cores = [null, null];  // each side's map, once its style has loaded
const loads = [0, 0];        // bumped on each load, so a stale one gives up
let mirroring = false;

function mirror(from, to) {
  if (mirroring || !to) return;
  mirroring = true;   // to.jumpTo fires `move` on `to`, which must not echo back
  const c = from.getCenter();
  to.jumpTo({ center: [c.lng, c.lat], zoom: from.getZoom() });
  mirroring = false;
}

async function load(i) {
  const n = ++loads[i];
  const style = await loadBasemap(selects[i].value, lang);
  if (loads[i] !== n) return;
  const view = cores[i]?.raw;
  cores[i]?.destroy();
  cores[i] = null;
  const core = createMap(containers[i], { style });
  if (view) core.raw.jumpTo({ center: view.getCenter(), zoom: view.getZoom() });
  core.ready(() => {
    if (loads[i] !== n) return;
    const other = cores[1 - i]?.raw;
    if (other) mirror(other, core.raw);
    core.raw.on("move", () => mirror(core.raw, cores[1 - i]?.raw));
    cores[i] = core;
  });
}

SIDES.forEach((side, i) => {
  const chosen = page.has(side) ? basemapId(page.get(side)) : DEFAULT[side];
  for (const [value, name] of Object.entries(BASEMAP_NAMES)) {
    selects[i].add(new Option(name, value, false, value === chosen));
  }
  selects[i].addEventListener("change", () => {
    page.set(side, selects[i].value);
    history.replaceState(null, "", `?${page}`);
    load(i);
  });
  load(i);
});
</script>
</body>
</html>
