<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Warming Centers</title>
<!-- The centers are sample data, so the page stays out of search results. Remove this
     once the map shows the City's own current data. -->
<meta name="robots" content="noindex">
<!-- Fetched alongside the stylesheet rather than after it, so the hero's heading is set
     in Clash Grotesk at first paint instead of changing face, and height, under the
     reader. -->
<link rel="preload" href="/fonts/ClashGrotesk-Semibold.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. main.tsx translates each data-t element's text. -->
<div class="prototype-note">
<p><strong data-t>Prototype only.</strong>
<span data-t>To find a warming center, call 311.</span></p>
<!-- Which way a center's card opens, and how many sample centers the map loads. main.tsx
     marks the current choices and wires them. -->
<div class="note-switches">
<div class="note-switch" role="group" aria-labelledby="card-mode-label" data-param="detail">
<span id="card-mode-label" data-t>Detail card options:</span>
<button type="button" data-value="side" data-t>Sidebar</button>
<button type="button" data-value="popup" data-t>Pop-up</button>
</div>
<div class="note-switch" role="group" aria-labelledby="dataset-label" data-param="dataset">
<span id="dataset-label" data-t>Sample size:</span>
<button type="button" data-value="28">28</button>
<button type="button" data-value="1500">1,500</button>
<button type="button" data-value="10000">10,000</button>
</div>
<!-- Empty at load, so a screen reader is already watching it when main.tsx fills it in. -->
<span class="visually-hidden" role="status" id="note-status"></span>
</div>
<button class="note-close" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="visually-hidden" data-t>Close prototype notice</span></button>
</div>
<div id="root"></div>
<script type="module" src="/src/warming/main.tsx"></script>
</body>
</html>
