<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Warming Centers</title>
<!-- The centers are sample data, so the page stays out of search results. Remove this
     once the map shows the City's own current data. -->
<meta name="robots" content="noindex">
<!-- Fetched alongside the stylesheet rather than after it, so the hero's heading is set
     in Clash Grotesk at first paint instead of changing face, and height, under the
     reader. -->
<link rel="preload" href="/fonts/ClashGrotesk-Semibold.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. main.tsx translates each data-t element's text. -->
<div class="prototype-note">
<p><strong data-t>Prototype only.</strong>
<span data-t>To find a warming center, call 311.</span></p>
<!-- Which way a center's card opens. main.tsx marks the current one and wires them. -->
<div class="card-mode" role="group" aria-labelledby="card-mode-label">
<span id="card-mode-label" data-t>Card</span>
<button type="button" data-detail="side" data-t>Sidebar</button>
<button type="button" data-detail="popup" data-t>Pop-up</button>
</div>
</div>
<div id="root"></div>
<script type="module" src="/src/warming/main.tsx"></script>
</body>
</html>
