<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nyc-map-kit — the map, embedded</title>

<!--
  The examples page: the block near full width with the list, the same data without the
  list, a one-site frame, and a menu that switches the basemap under all of them. Nothing
  else. The map on its own is index.html. Everything the page used to say about itself —
  what the component is, what to try, what the network tab shows — belongs in the README,
  where it can be read without a map scrolled off the top of the screen.

  No web font. The claim the block makes is that nothing loads from a third party except
  the tile server and the CDN serving MapLibre, and dressing up this page from
  fonts.googleapis.com would make the network tab disagree with the page. System faces.

  The frames run the full width of the page column: the block switches to its side-panel
  layout above 768 px, so a map confined to a text measure would only ever show its phone
  layout.

  The last frame is the exception, and is there on purpose: 390 px wide, which is below
  that breakpoint, so on a desktop screen it shows the phone layout — the list as a
  bottom sheet over the map — without anyone having to open the page on a phone. On a
  phone it is simply the page width, because the frame around it would be a lie.
-->
<style>
  :root {
    --line:    #d9d9d9;
    --paper:   #ffffff;
    --accent:  #1a3fb0;   /* the pin blue, darkened enough to carry as text */
    --wide:    100%;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 24px 24px 48px;
    background: var(--paper);
    color: #1a1a1a;
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-synthesis-weight: none;
  }

  main { width: var(--wide); margin: 0 auto; }

  figure { margin: 0 0 24px; }
  figure iframe {
    display: block;
    width: 100%;
    height: calc(100vh - 48px);
    min-height: 520px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #f5f5f5;
  }
  figure.single iframe { height: 320px; min-height: 0; }

  /* The phone frame. 390 x 844 is the iPhone 14/15 viewport, and the width is what
     matters: the block reads its own frame, not the screen, so at 390 px it lays itself
     out exactly as it would on a handset. */
  figure.phone { display: flex; justify-content: center; }
  figure.phone iframe {
    width: 390px;
    max-width: 100%;
    height: 844px;
    min-height: 0;
    border-radius: 18px;
  }

  /* The provenance note in full. Each frame also carries the block's own one-line note
     (see index.html). */
  .note {
    margin: 0 0 24px;
    padding: 12px 16px;
    border: 1px solid #d9c79a;
    border-radius: 6px;
    background: #fbf7ec;
    font-size: 0.9375rem;
    line-height: 1.55;
  }
  .note p { margin: 0; }

  /* The basemap menu. It sets ?basemap= on this page, so a link carries the choice, and
     hands it to every frame. */
  .basemap { margin: 0 0 16px; font-size: 0.9375rem; }
  .basemap select { font: inherit; margin-left: 8px; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  @media (max-width: 720px) {
    body { padding: 16px 16px 40px; }
    figure iframe { height: 78vh; min-height: 460px; }
    /* Already a phone: the frame drops its phone-shaped constraints and behaves like
       every other frame on the page. */
    figure.phone iframe { width: 100%; height: 78vh; border-radius: 6px; }
  }
</style>
</head>

<body>
<main>

  <div class="note">
    <p><strong>Prototype, not a City service.</strong> The data is a September 2026 snapshot
    and is not authoritative; pins are geocoded from street addresses and some are
    approximate. For current information see the City's
    <a href="https://www.nyc.gov/main/services/snap-benefits/abawd">ABAWD volunteering
    page</a>, and confirm any site with the organization that runs it.</p>
  </div>

  <p class="basemap"><label>Basemap <select id="basemap"></select></label></p>

  <figure>
    <iframe id="map-all" title="Map of SNAP volunteer opportunities in New York City"
            src="./?list=on"></iframe>
  </figure>

  <figure>
    <iframe id="map-nolist" title="Map of SNAP volunteer opportunities in New York City, without the list"
            src="./?list=off"></iframe>
  </figure>

  <figure class="single">
    <iframe id="map-one" title="Map of one SNAP volunteer site"
            src="./?list=off&amp;data=one-site.geojson&amp;title=Henry%20Street%20Settlement"></iframe>
  </figure>

  <figure class="phone">
    <iframe id="map-phone" title="Map of SNAP volunteer opportunities in New York City, at phone width"
            src="./?list=on"></iframe>
  </figure>

</main>

<script type="module">
import { BASEMAP_NAMES, basemapId } from "./src/core/basemaps/names.ts";

const page = new URLSearchParams(location.search);
const menu = document.getElementById("basemap");
const chosen = basemapId(page.get("basemap"));
for (const [id, name] of Object.entries(BASEMAP_NAMES)) {
  menu.add(new Option(name, id, false, id === chosen));
}

function show(id) {
  for (const frame of document.querySelectorAll("figure iframe")) {
    const url = new URL(frame.getAttribute("src"), location.href);
    url.searchParams.set("basemap", id);
    frame.src = `./?${url.searchParams}`;
  }
}

if (page.has("basemap")) show(chosen);
menu.addEventListener("change", () => {
  page.set("basemap", menu.value);
  history.replaceState(null, "", `?${page}`);
  show(menu.value);
});
</script>

<!--
  The language toggle that used to sit here is removed until the translation approach is
  settled. It read "Ver los mapas en español" and switched only the basemap's place labels
  — the block's own copy stayed English — so it promised a translated page and did not
  deliver one. The capability itself is untouched: ?lang=es on the map still switches the
  basemap labels, which is the part a DOM translator cannot reach.
-->

</body>
</html>
