<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public computer centers map</title>
<meta name="robots" content="noindex">
<!--
  The same page as index.html, the computer centers map, at its own address so links made
  to it keep working. A copy rather than a redirect, so an embed keeps the host page as its
  referrer, which sets the block's language (see logic/i18n.ts). Keep the two the same.
-->
<link rel="preload" href="/fonts/noto-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body data-config="computer-centers/config.json" data-data="computer-centers/sites.geojson"
      data-orgs="">
<section class="prototype-note" aria-labelledby="note-title"><strong id="note-title" data-t>Prototype, not a City service.</strong>
<span data-t>For current information see the City's</span>
<a href="https://data.cityofnewyork.us/d/sejx-2gn3" target="_top" data-t>public computer centers data</a><span>.</span>
<button class="note-close" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="visually-hidden" data-t>Close prototype notice</span></button></section>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
