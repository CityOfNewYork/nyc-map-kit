<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAP volunteer opportunities map</title>
<!-- The data is a prototype snapshot, so the page stays out of search results. Remove this
     once the map shows the City's own current data. -->
<meta name="robots" content="noindex">

<!--
  THE BLOCK. This is the map page. It opens on its own, at <site>/app/, and is meant to be
  dropped into a host page inside an <iframe>:

    <iframe src="https://cityofnewyork.github.io/nyc-map-kit/app/?list=on"
            title="Map of SNAP volunteer opportunities"
            style="width:100%;height:640px;border:0"></iframe>

  It fills whatever box the host gives it and has no size of its own. examples.html embeds
  it several times as a worked example. Everything inside #root is rendered by React from
  src/main.tsx; the components in src/ui/ hold the markup and the reasons for it.

  This is the source page; `npm run build` turns it into dist/app/index.html. Every
  stylesheet and script is bundled and every built path is relative (vite.config.ts sets
  `base: "./"`), so the build works at localhost and under a GitHub Pages subpath alike.
  `/fonts/…` below names a file in app/public/, and the build rewrites it to a relative path.
-->
<!-- Fetched alongside the stylesheet rather than after it, so the text is set in Noto
     Sans before the list first paints instead of swapping in under the reader. -->
<link rel="preload" href="/fonts/noto-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. It travels with every frame that embeds the block. -->
<p class="prototype-note"><strong>Prototype, not a City service.</strong>
<span>For current information see the City's</span>
<a href="https://www.nyc.gov/main/services/snap-benefits/abawd" target="_top">ABAWD volunteering page</a><span>.</span></p>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
