<title>Public computer centers map</title>
<meta name="robots" content="noindex">

<!--
  THE BLOCK. This is the map page, here showing the City's public computer centers. It
  opens on its own, at <site>/app/, and is meant to be dropped into a host page inside an
  <iframe>:

    <iframe src="https://cityofnewyork.github.io/nyc-map-kit/app/?list=on"
            title="Map of public computer centers"
            style="width:100%;height:640px;border:0"></iframe>

  It fills whatever box the host gives it and has no size of its own. Everything inside
  #root is rendered by React from src/main.tsx; the components in src/ui/ hold the markup
  and the reasons for it. snap.html is the same block on another dataset, and
  examples.html embeds that one several times as a worked example.

  The page names its own files on <body>; main.tsx reads them. The data is built by
  build/computer-centers.py, and computer-centers/config.json decides what the card shows.
  It has no orgs.json: each center is its own entry. computer-centers.html is this same
  page at its own address; keep the two the same.

  This is the source page; `npm run build` turns it into dist/app/index.html. Every
  stylesheet and script is bundled and every built path is relative (vite.config.ts sets
  `base: "./"`), so the build works at localhost and under a GitHub Pages subpath alike.
  `/fonts/…` below names a file in app/public/, and the build rewrites it to a relative path.
-->
<!-- Fetched alongside the stylesheet rather than after it, so the text is set in Noto
     Sans before the list first paints instead of swapping in under the reader. -->
<link rel="preload" href="/fonts/noto-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body data-config="computer-centers/config.json" data-data="computer-centers/sites.geojson"
      data-orgs="">
<!-- Google Tag Manager (noscript) -->

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. It travels with every frame that embeds the block.
     main.tsx translates each data-t element's text. A region named by its first words, so
     a screen reader moving by landmarks finds it. -->
<section class="prototype-note" aria-labelledby="note-title"><strong id="note-title" data-t>Prototype, not a City service.</strong>
<span data-t>For current information see the City's</span>
<a href="https://data.cityofnewyork.us/d/sejx-2gn3" target="_top" data-t>public computer centers data</a><span>.</span>
<button class="note-close" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="visually-hidden" data-t>Close prototype notice</span></button></section>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
