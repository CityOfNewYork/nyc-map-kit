<title>SNAP volunteer opportunities map</title>
<!-- The data is a prototype snapshot, so the page stays out of search results. Remove this
     once the map shows the City's own current data. -->
<meta name="robots" content="noindex">

<!--
  The block (see index.html) showing SNAP volunteer opportunities, at <site>/app/snap.html.
  It names no files on <body>, so it takes the defaults in app/public/: config.json,
  sites.geojson and orgs.json. examples.html embeds it several times as a worked example.
-->
<!-- Fetched alongside the stylesheet rather than after it, so the text is set in Noto
     Sans before the list first paints instead of swapping in under the reader. -->
<link rel="preload" href="/fonts/noto-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7Z4H9CG"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. It travels with every frame that embeds the block.
     main.tsx translates each data-t element's text. A region named by its first words, so
     a screen reader moving by landmarks finds it. -->
<section class="prototype-note" aria-labelledby="note-title"><strong id="note-title" data-t>Prototype, not a City service.</strong>
<span data-t>For current information see the City's</span>
<a href="https://www.nyc.gov/main/services/snap-benefits/abawd" target="_top" data-t>ABAWD volunteering page</a><span>.</span>
<button class="note-close" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="visually-hidden" data-t>Close prototype notice</span></button></section>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
