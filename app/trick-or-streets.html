<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trick-or-Streets</title>
<!-- A copy of DOT's map, not DOT's own, so the page stays out of search results. -->
<meta name="robots" content="noindex">
<!-- Fetched alongside the stylesheet rather than after it, so the hero's heading is set
     in Clash Grotesk at first paint instead of changing face, and height, under the
     reader. -->
<link rel="preload" href="/fonts/ClashGrotesk-Semibold.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
<!-- Plain HTML outside React, so it is on screen at first paint, even if the map fails to
     load, and costs no layout shift. main.tsx translates each data-t element's text. A
     region named by its first words, so a screen reader moving by landmarks finds it. -->
<section class="prototype-note" aria-labelledby="note-title"><strong id="note-title" data-t>Prototype only.</strong>
<a href="https://www.nyc.gov/html/dot/html/pedestrians/trickorstreets.shtml" data-t>For official event details, see NYC DOT's page.</a>
<button class="note-close" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="visually-hidden" data-t>Close prototype notice</span></button></section>
<div id="root"></div>
<script type="module" src="/src/trick-or-streets/main.tsx"></script>
</body>
</html>
